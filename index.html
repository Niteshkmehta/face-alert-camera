<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Test</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        text-align: center;
    }

    header {
        background: #1f2937;
        color: white;
        padding: 20px;
    }

    .container {
        max-width: 900px;
        margin: 30px auto;
        padding: 20px;
    }

    .camera {
        background: black;
        border-radius: 12px;
        overflow: hidden;
    }

    video {
        width: 100%;
        display: block;
    }

    button {
        padding: 14px 25px;
        margin: 15px 5px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
    }

    #start {
        background: #16a34a;
        color: white;
    }

    #stop {
        background: #dc2626;
        color: white;
    }

    button:disabled {
        opacity: 0.5;
    }

    #status {
        padding: 15px;
        background: white;
        border-radius: 8px;
        margin-top: 15px;
    }

    #debug {
        margin-top: 15px;
        padding: 15px;
        background: #111827;
        color: #d1fae5;
        text-align: left;
        font-family: monospace;
        white-space: pre-wrap;
        border-radius: 8px;
    }
</style>
</head>

<body>

<header>
    <h1>📷 Camera Stability Test</h1>
    <p>No face detection — camera only</p>
</header>

<div class="container">

    <div class="camera">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <button id="start">
        ▶ Start Camera
    </button>

    <button id="stop" disabled>
        ■ Stop Camera
    </button>

    <div id="status">
        Camera is stopped.
    </div>

    <div id="debug">
        Waiting...
    </div>

</div>


<script>

const video =
    document.getElementById("video");

const startButton =
    document.getElementById("start");

const stopButton =
    document.getElementById("stop");

const status =
    document.getElementById("status");

const debug =
    document.getElementById("debug");

let stream = null;


/* ----------------------------------
   DEBUG MESSAGE
---------------------------------- */

function log(message) {

    const time =
        new Date().toLocaleTimeString();

    debug.textContent =
        time + " - " + message +
        "\n" + debug.textContent;

}


/* ----------------------------------
   START CAMERA
---------------------------------- */

async function startCamera() {

    try {

        log("Requesting camera...");

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: true,

                audio: false

            });


        log("Camera stream received.");


        video.srcObject =
            stream;


        await video.play();


        log("Video is playing.");


        startButton.disabled =
            true;

        stopButton.disabled =
            false;


        status.textContent =
            "🟢 CAMERA RUNNING";


        /*
        Monitor the actual camera track.
        */

        const track =
            stream.getVideoTracks()[0];


        log(
            "Camera: " +
            track.label
        );


        log(
            "Track state: " +
            track.readyState
        );


        track.onended = function() {

            log(
                "⚠️ CAMERA TRACK ENDED"
            );

            status.textContent =
                "🔴 CAMERA STOPPED";

        };


        track.onmute = function() {

            log(
                "⚠️ CAMERA MUTED"
            );

        };


        track.onunmute = function() {

            log(
                "🟢 CAMERA UNMUTED"
            );

        };


        /*
        Check camera every second.
        */

        setInterval(function() {

            if (!stream) {
                return;
            }

            const currentTrack =
                stream.getVideoTracks()[0];

            if (currentTrack) {

                log(
                    "Track: " +
                    currentTrack.readyState +
                    " | enabled: " +
                    currentTrack.enabled
                );

            }

        }, 5000);


    }

    catch(error) {

        console.error(error);

        log(
            "ERROR: " +
            error.message
        );

        status.textContent =
            "❌ ERROR: " +
            error.message;

    }

}


/* ----------------------------------
   STOP CAMERA
---------------------------------- */

function stopCamera() {

    if (stream) {

        stream
            .getTracks()
            .forEach(
                track => track.stop()
            );

    }


    stream = null;

    video.srcObject = null;


    startButton.disabled =
        false;

    stopButton.disabled =
        true;


    status.textContent =
        "Camera stopped.";


    log(
        "Camera manually stopped."
    );

}


/* ----------------------------------
   BUTTONS
---------------------------------- */

startButton.addEventListener(
    "click",
    startCamera
);


stopButton.addEventListener(
    "click",
    stopCamera
);

</script>

</body>
</html>
